[project]
name = "india-sourcing"
version = "0.1.0"
description = "A pipeline for detecting Indian pre-seed deeptech companies."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-socket>=0.7,<1",
    "ruff>=0.8,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "src/connectors"]

[tool.ruff]
line-length = 100
target-version = "py311"
